name: Release

# Push a tag equal to the manifest version (for example 0.0.2, no "v") to build
# the plugin and attach main.js, manifest.json and styles.css to a draft release.
on:
  push:
    tags: ['*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tag must match manifest and versions.json
        run: |
          node -e '
            const fs = require("fs");
            const tag = process.env.GITHUB_REF_NAME;
            const { version, minAppVersion } = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
            if (tag !== version) throw new Error(`Tag ${tag} does not match manifest version ${version}`);
            if (versions[version] !== minAppVersion) throw new Error(`versions.json lacks ${version}: ${minAppVersion}`);
          '
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME" --generate-notes
